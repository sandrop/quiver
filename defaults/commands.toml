[[command]]
label = "ask me again"
command = "askuserquestion again"
tags = ["prose", "instructions"]




# claude
[[command]]
label = "session rename"
command = "/rename "
tags = ["claude"]

[[command]]
label = "Claude Code version"
command = "! claude --version"
tags = ["claude"]

[[command]]
label = "Claude Code health check"
command = "! claude doctor"
tags = ["claude"]

[[command]]
label = "MCP servers"
command = "! claude mcp list"
tags = ["claude"]

[[command]]
label = "Installed plugins"
command = "! claude plugin list"
tags = ["claude"]

[[command]]
label = "Plugin marketplaces"
command = "! claude plugin marketplace list"
tags = ["claude"]

[[command]]
label = "model claude-sonnet-5-5[1m]"
command = "/model claude-sonnet-5-5[1m]"
tags = ["command", "env", "claude"]

[[command]]
label = "model claude-opus-5-5[1m]"
command = "/model claude-opus-5-5[1m]"
tags = ["command", "env", "claude"]

[[command]]
label = "model claude-fable-5[1m]"
command = "/model claude-fable-5[1m]"
tags = ["command", "env", "claude"]


# git
[[command]]
label = "Git status (short)"
command = "! git status -sb"
tags = ["git"]

[[command]]
label = "Git log (last 20)"
command = "! git log --oneline -n 20"
tags = ["git"]

[[command]]
label = "Git log graph (all branches)"
command = "! git log --oneline --graph --all -n 30"
tags = ["git"]

[[command]]
label = "Git diff stat"
command = "! git diff --stat"
tags = ["git"]

[[command]]
label = "Git staged diff"
command = "! git diff --cached"
tags = ["git"]

[[command]]
label = "Git branches with upstream"
command = "! git branch -vv"
tags = ["git"]

[[command]]
label = "Git remotes"
command = "! git remote -v"
tags = ["git"]

[[command]]
label = "Git stash list"
command = "! git stash list"
tags = ["git"]

# files and search
[[command]]
label = "Files changed in the last day"
command = "! find . -type f -mtime -1"
tags = ["files", "search"]


[[command]]
label = "Grep TODOs with line numbers"
command = "! grep -rn TODO ."
tags = ["search"]

[[command]]
label = "Files containing TODO"
command = "! grep -rl TODO ."
tags = ["search"]

# net
[[command]]
label = "Hostname"
command = "! hostname"
tags = ["net"]

[[command]]
label = "Ping 1.1.1.1 three times"
command = "! ping -c 3 1.1.1.1"
tags = ["net"]

[[command]]
label = "HTTP headers for a URL"
command = "! curl -sI https://example.com"
tags = ["net"]

[[command]]
label = "Proxy environment variables"
command = "! env | grep -i proxy"
tags = ["net"]
