# quiver starter pack. Install with `python3 cli/quiver.py init`; it copies
# this file to ~/.config/sct/quiver/commands.toml and never overwrites.
# Shell entries start with `! ` so Claude Code runs them as shell commands; each
# is read-only and uses stock macOS and Debian/Ubuntu tools or `claude`. Slash
# commands and prose replies insert as typed. The sct tooling entries need the
# cobtask-workflow, cobtask-review and context-window-manager plugins.
# Modeled on Pet (https://github.com/knqyf263/pet) by knqyf263.



# sct tooling
[[command]]
label = "context-window-manager:handoff"
command = "/context-window-manager:handoff"
tags = ["command", "context", "sp"]

[[command]]
label = "cobtask-new"
command = "/cobtask-workflow:cobtask-new"
tags = ["command", "cobtask", "sp"]

[[command]]
label = "cobtask-start"
command = "/cobtask-workflow:cobtask-start"
tags = ["command", "cobtask", "sp"]

[[command]]
label = "cobtask-review"
command = "/cobtask-review:cobtask-review"
tags = ["command", "cobtask", "sp"]

[[command]]
label = "cobtask-close"
command = "/cobtask-workflow:cobtask-close"
tags = ["command", "cobtask", "sp"]


# misc prose instructions
[[command]]
label = "continue with option 1"
command = "continue with option 1"
tags = ["prose", "instructions"]

[[command]]
label = "what do you recommend?"
command = "what do you recommend?"
tags = ["prose", "instructions"]

[[command]]
label = "done with this session?"
command = "done with this session?"
tags = ["prose", "instructions"]

[[command]]
label = "git merge commit and cleanup"
command = "git merge commit and cleanup"
